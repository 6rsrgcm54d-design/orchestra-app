function doGet(e) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  e = e || { parameter: {} };
  var sheetName = e.parameter.sheet;
  var action = e.parameter.action;

  if (action === 'getMeta') {
    var sheets = ss.getSheets().map(function(s, idx) {
      return { properties: { sheetId: idx, title: s.getName() } };
    });
    return jsonResponse({ title: ss.getName(), sheets: sheets });
  }

  if (sheetName) {
    var sheet = findSheet(ss, sheetName);
    if (!sheet) {
      sheet = initDefaultSheet(ss, sheetName);
    }
    var values = sheet.getDataRange().getValues();
    var displayValues = sheet.getDataRange().getDisplayValues();
    var formatted = values.map(function(row, rIdx) {
      return row.map(function(cell, cIdx) {
        var disp = (displayValues && displayValues[rIdx]) ? String(displayValues[rIdx][cIdx]).trim() : '';
        if (cell instanceof Date) {
          // Se o ano for <= 1900, o utilizador introduziu uma hora (ex: 15:00 ou 16h00)
          if (cell.getFullYear() <= 1900) {
            if (disp && (disp.indexOf(':') !== -1 || disp.indexOf('h') !== -1 || disp.indexOf('.') !== -1)) {
              return disp;
            }
            return Utilities.formatDate(cell, ss.getSpreadsheetTimeZone(), "HH:mm");
          }
          if (cell.getHours() !== 0 || cell.getMinutes() !== 0) {
            return Utilities.formatDate(cell, ss.getSpreadsheetTimeZone(), "yyyy-MM-dd HH:mm");
          }
          return Utilities.formatDate(cell, ss.getSpreadsheetTimeZone(), "yyyy-MM-dd");
        }
        return disp || String(cell);
      });
    });
    return jsonResponse({ values: formatted });
  }

  var result = {};
  ss.getSheets().forEach(function(s) {
    result[s.getName()] = s.getDataRange().getDisplayValues();
  });
  return jsonResponse(result);
}

function doPost(e) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var data = JSON.parse(e.postData.contents);
  var action = data.action;
  var sheetName = data.sheet;
  var sheet = findSheet(ss, sheetName);

  if (!sheet) {
    sheet = initDefaultSheet(ss, sheetName);
  }

  if (action === 'append') {
    data.values.forEach(function(row) {
      sheet.appendRow(row);
    });
    return jsonResponse({ success: true });
  }

  if (action === 'update') {
    if (data.rowIndex) {
      var row = data.values[0];
      sheet.getRange(data.rowIndex, 1, 1, row.length).setValues([row]);
    } else if (data.values && data.values.length) {
      var numRows = data.values.length;
      var numCols = data.values[0].length;
      sheet.getRange(1, 1, numRows, numCols).setValues(data.values);
    }
    return jsonResponse({ success: true });
  }

  if (action === 'delete') {
    var rowIndex = data.rowIndex;
    if (rowIndex > 0 && rowIndex <= sheet.getLastRow()) {
      sheet.deleteRow(rowIndex);
    }
    return jsonResponse({ success: true });
  }

  return jsonResponse({ success: false, error: 'Unknown action' });
}

function findSheet(ss, name) {
  if (!name) return null;
  var direct = ss.getSheetByName(name);
  if (direct) return direct;
  var clean = String(name).trim().toLowerCase();
  var sheets = ss.getSheets();
  for (var i = 0; i < sheets.length; i++) {
    var cur = sheets[i].getName().trim().toLowerCase();
    if (cur === clean || cur.indexOf(clean) !== -1 || clean.indexOf(cur) !== -1) {
      return sheets[i];
    }
  }
  return null;
}
